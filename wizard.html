<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de Procesos — PID Etapa 2 · Grupo Corven</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --accent:#E85020; --accent-l:#FDF0EC; --navy:#1A1A2E; --white:#fff;
  --soft:#F5F5F7; --ink:#1A1A1A; --ink2:#555; --muted:#999;
  --line:#E2E2E2; --green:#27AE60; --green-l:#EAF7EF;
  --amber:#D97706; --amber-l:#FEF3E0;
  --red:#E74C3C; --red-l:#FEF0EE;
  --blue:#276BA5; --blue-l:#EAF1F8;
  --purple:#7C3AED; --purple-l:#F3EEFF;
  --sans:'DM Sans',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);color:var(--ink);background:var(--soft);overflow:hidden}

/* ── TOP BAR ── */
#topbar{
  height:48px;background:var(--navy);display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;flex-shrink:0;
}
#topbar .brand{color:#fff;font-weight:700;font-size:14px;letter-spacing:-.01em}
#topbar .brand span{color:var(--accent)}
#topbar .actions{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--sans);border:none;transition:.15s}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#c73e18}
.btn-soft{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.btn-soft:hover{background:var(--line)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#1e8e4e}

/* ── LAYOUT ── */
#app{display:flex;height:calc(100vh - 48px);overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{
  width:270px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
}
#sidebar-header{
  padding:16px;border-bottom:1px solid var(--line);flex-shrink:0;
}
#sidebar-header h3{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
#process-list{flex:1;overflow-y:auto;padding:8px}
.proc-item{
  padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;
  border:1.5px solid transparent;transition:.15s;
}
.proc-item:hover{background:var(--soft)}
.proc-item.active{background:var(--accent-l);border-color:rgba(232,80,32,.25)}
.proc-item .proc-name{font-size:13px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proc-item .proc-area{font-size:11px;color:var(--muted);margin-top:2px}
.proc-item .proc-status{margin-top:6px}
.status-badge{
  display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
}
.st-preA{background:#F3EEFF;color:var(--purple)}
.st-preB{background:var(--blue-l);color:var(--blue)}
.st-gate{background:var(--red-l);color:var(--red)}
.st-preC{background:var(--amber-l);color:var(--amber)}
.st-paso{background:var(--accent-l);color:var(--accent)}
.st-signoff{background:var(--green-l);color:var(--green)}
.st-completed{background:var(--green-l);color:var(--green)}
.st-discarded{background:#f5f5f5;color:var(--muted)}
.empty-list{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}

/* ── MAIN PANEL ── */
#main{flex:1;overflow-y:auto;padding:28px 36px}
#empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;color:var(--muted);
}
#empty-state h2{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px}
#empty-state p{font-size:14px;line-height:1.6;max-width:380px}

/* ── STEP HEADER ── */
#step-header{margin-bottom:24px}
.step-meta{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:2px;color:var(--muted);margin-bottom:6px}
.step-title{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.step-subtitle{font-size:14px;color:var(--ink2);margin-top:4px}

/* ── PROGRESS BAR ── */
#progress-wrap{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin-bottom:24px;overflow-x:auto;
}
.progress-track{display:flex;align-items:center;min-width:600px}
.progress-node{
  display:flex;flex-direction:column;align-items:center;flex:1;
  position:relative;cursor:pointer;
}
.progress-node:not(:last-child)::after{
  content:'';position:absolute;top:13px;left:50%;width:100%;
  height:2px;background:var(--line);z-index:0;
}
.progress-node.done:not(:last-child)::after{background:var(--green)}
.progress-node.active:not(:last-child)::after{background:var(--line)}
.pn-dot{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--muted);z-index:1;
  position:relative;transition:.2s;flex-shrink:0;
}
.progress-node.done .pn-dot{background:var(--green);border-color:var(--green);color:#fff}
.progress-node.active .pn-dot{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.2)}
.progress-node.gate .pn-dot{border-color:var(--red);color:var(--red)}
.progress-node.gate.done .pn-dot{background:var(--green);border-color:var(--green);color:#fff}
.pn-label{font-size:9px;font-weight:600;color:var(--muted);margin-top:5px;
  text-align:center;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.progress-node.active .pn-label{color:var(--accent);font-weight:700}
.progress-node.done .pn-label{color:var(--green)}

/* ── FORM ── */
.form-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:24px;margin-bottom:16px;
}
.form-card.highlight-card{
  border-color:rgba(232,80,32,.3);background:var(--accent-l);
}
.form-section-title{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--accent);margin-bottom:16px;padding-bottom:8px;
  border-bottom:2px solid var(--accent-l);
}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
label .hint{font-weight:400;color:var(--muted);font-style:italic;margin-left:4px}
label .required{color:var(--accent);margin-left:2px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;
  transition:.15s;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
.calc-field{
  padding:9px 12px;background:var(--soft);border:1.5px solid var(--line);
  border-radius:8px;font-size:13px;font-weight:700;color:var(--accent);
  min-height:40px;display:flex;align-items:center;
}

/* radio & checkbox */
.radio-group,.check-group{display:flex;flex-wrap:wrap;gap:8px}
.radio-opt,.check-opt{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border:1.5px solid var(--line);border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--ink2);transition:.15s;
  user-select:none;
}
.radio-opt:hover,.check-opt:hover{border-color:var(--accent);color:var(--accent)}
.radio-opt.selected,.check-opt.selected{
  border-color:var(--accent);background:var(--accent-l);color:var(--accent);font-weight:700;
}
.radio-opt input,.check-opt input{display:none}

/* repeatable */
.rep-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.rep-row{display:flex;gap:6px;align-items:center}
.rep-row input{flex:1}
.rep-del{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:16px;padding:4px;border-radius:4px;flex-shrink:0}
.rep-del:hover{color:var(--red);background:var(--red-l)}
.btn-add-rep{font-size:12px;color:var(--accent);background:none;border:none;
  cursor:pointer;font-weight:600;padding:4px 0;font-family:var(--sans)}
.btn-add-rep:hover{text-decoration:underline}

/* steps (as-is) */
.steps-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.step-row{display:flex;gap:8px;align-items:flex-start}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;flex-shrink:0;margin-top:8px}
.step-row textarea{flex:1;min-height:52px}

/* stage1 panel */
.stage1-panel{
  background:var(--soft);border:1px solid var(--line);border-radius:8px;
  padding:14px;max-height:220px;overflow-y:auto;
}
.stage1-panel .s1-empty{color:var(--muted);font-size:12px;text-align:center;padding:12px}
.s1-item{
  display:flex;align-items:flex-start;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:12px;
}
.s1-item:last-child{border-bottom:none}
.s1-badge{
  flex-shrink:0;padding:2px 6px;border-radius:4px;font-size:9px;
  font-weight:700;text-transform:uppercase;
}
.s1-pp{background:var(--red-l);color:var(--red)}
.s1-opp{background:var(--green-l);color:var(--green)}
.s1-title{color:var(--ink);line-height:1.4}
.s1-id{color:var(--muted);font-size:10px}

/* kill gate */
.gate-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.gate-title{font-size:16px;font-weight:800;color:var(--red);margin-bottom:6px}
.gate-subtitle{font-size:13px;color:var(--ink2);margin-bottom:20px}
.gate-criteria{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.gate-crit{
  display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:.15s;
}
.gate-crit:hover{border-color:var(--green)}
.gate-crit.checked{border-color:var(--green);background:var(--green-l)}
.gate-crit .crit-check{
  width:20px;height:20px;border-radius:4px;border:2px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;transition:.15s;margin-top:1px;
}
.gate-crit.checked .crit-check{background:var(--green);border-color:var(--green)}
.gate-crit .crit-text{font-size:13px;color:var(--ink);line-height:1.4}
.gate-discard{margin-top:16px}
.gate-discard label{font-size:12px;font-weight:700;color:var(--red);margin-bottom:6px}

/* realignment */
.realign-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}

/* habilitantes */
.hab-list{display:flex;flex-direction:column;gap:8px}
.hab-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:.15s;
}
.hab-item:hover{border-color:var(--accent)}
.hab-check{
  width:18px;height:18px;border-radius:4px;border:2px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;transition:.15s;
}
.hab-item.resolved .hab-check{background:var(--green);border-color:var(--green)}
.hab-item.inprogress .hab-check{background:var(--amber);border-color:var(--amber)}
.hab-item .hab-label{font-size:12px;color:var(--ink);flex:1}
.hab-status-cycle{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}
.hab-item.resolved .hab-status-cycle{background:var(--green-l);color:var(--green)}
.hab-item.inprogress .hab-status-cycle{background:var(--amber-l);color:var(--amber)}
.hab-item.pending .hab-status-cycle{background:var(--red-l);color:var(--red)}

/* confirm checkbox */
.confirm-check{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:.15s;
}
.confirm-check:hover{border-color:var(--accent)}
.confirm-check.checked{border-color:var(--green);background:var(--green-l)}
.confirm-box{
  width:20px;height:20px;border-radius:4px;border:2px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;transition:.15s;margin-top:1px;
}
.confirm-check.checked .confirm-box{background:var(--green);border-color:var(--green)}
.confirm-text{font-size:13px;color:var(--ink);line-height:1.5}

/* nav buttons */
#step-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:24px;padding-top:20px;border-top:1px solid var(--line);
}
.nav-info{font-size:12px;color:var(--muted)}

/* info banner */
.info-banner{
  background:var(--blue-l);border:1px solid rgba(39,107,165,.2);
  border-radius:8px;padding:12px 14px;font-size:12px;color:var(--blue);
  line-height:1.6;margin-bottom:16px;
}
.warn-banner{
  background:var(--amber-l);border:1px solid rgba(217,119,6,.2);
  border-radius:8px;padding:12px 14px;font-size:12px;color:var(--amber);
  line-height:1.6;margin-bottom:16px;font-weight:600;
}

/* discarded overlay */
.discarded-banner{
  background:var(--soft);border:2px solid var(--line);border-radius:12px;
  padding:24px;text-align:center;margin-bottom:20px;
}
.discarded-banner h3{font-size:16px;font-weight:700;color:var(--muted);margin-bottom:6px}
.discarded-banner p{font-size:13px;color:var(--muted)}

/* modal */
#modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  align-items:center;justify-content:center;
}
#modal-overlay.open{display:flex}
#modal{
  background:#fff;border-radius:14px;padding:28px;max-width:440px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
#modal h3{font-size:18px;font-weight:800;margin-bottom:8px}
#modal p{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
#new-proc-name{width:100%;margin-bottom:12px}
#new-proc-area{width:100%;margin-bottom:16px}

@media print{
  #topbar,#sidebar,#progress-wrap,#step-nav{display:none}
  #main{padding:0}
  .form-card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>

  completed:'st-completed', discarded:'st-discarded',
};

let db = {}, currentId = null, currentStepIdx = 0, stage1 = {pain_points:[], opportunities:[]};
let saveTimer = null;

async function loadDB(){
  try {
    const { data, error } = await sbClient.from('sections').select('content').eq('id', SB_ROW).single();
    if (error || !data) { db = {}; return; }
    db = JSON.parse(data.content || '{}');
  } catch { db = {}; }
}
async function saveDB(){
  showSaveIndicator('Guardando…');
  try {
    await sbClient.from('sections').upsert({ id: SB_ROW, content: JSON.stringify(db), updated_at: new Date().toISOString() });
    showSaveIndicator('Guardado ✓');
  } catch(e) { showSaveIndicator('Error al guardar'); console.error(e); }
  hideSaveIndicator();
}
function getData(){ return db[currentId]||{}; }
function getStepData(stepId){ return (getData()[stepId])||{}; }
function setStepData(stepId, patch){
  if(!db[currentId]) return;
  db[currentId][stepId] = Object.assign({}, getStepData(stepId), patch);
  db[currentId].updatedAt = new Date().toISOString();
  scheduleSave();
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDB, 400); }

// ════════════════════════════════════════════════════════
// STAGE 1 DATA
// ════════════════════════════════════════════════════════
fetch('data/stage1-data.json')
  .then(r=>r.json()).then(d=>{ stage1=d; })
  .catch(()=>{ console.warn('stage1-data.json no cargó — cross-reference deshabilitado'); });

function getStage1ForArea(area){
  if(!area||!stage1.pain_points) return {pps:[], opps:[]};
  const q = area.toLowerCase();
  const pps = stage1.pain_points.filter(p=>
    (p.area||'').toLowerCase().includes(q) ||
    (p.vertical||'').toLowerCase().includes(q) ||
    (p.title||'').toLowerCase().includes(q)
  ).slice(0,15);
  const opps = stage1.opportunities.filter(o=>
    (o.area||'').toLowerCase().includes(o) ||
    (o.vertical||'').toLowerCase().includes(q) ||
    (o.title||'').toLowerCase().includes(q)
  ).slice(0,10);
  return {pps, opps};
}

function renderSidebar(){
  const list = document.getElementById('process-list');
  const ids = Object.keys(db);
  if(!ids.length){ list.innerHTML='<div class="empty-list">Ningún proceso todavía.<br>Creá el primero.</div>'; return; }
  list.innerHTML = ids.map(id=>{
    const p = db[id];
    const active = id===currentId ? 'active':'';
    const badge = STATUS_LABELS[p.status]||p.status;
    const css = STATUS_CSS[p.status]||'st-preA';
    return `<div class="proc-item ${active}" onclick="selectProcess('${id}')">
      <div class="proc-name">${p.name||'Sin nombre'}</div>
      <div class="proc-area">${p.area||'—'}</div>
      <div class="proc-status"><span class="status-badge ${css}">${badge}</span></div>
    </div>`;
  }).join('');
}

function selectProcess(id){
  currentId = id;
  currentStepIdx = stepIdxFromStatus(db[id].status);
  renderSidebar();
  renderProcessView();
  document.getElementById('empty-state').style.display='none';
  document.getElementById('process-view').style.display='block';
  document.getElementById('btn-export').style.display='';
  document.getElementById('btn-onepager').style.display = db[id].status==='completed'?'':'none';
}

function stepIdxFromStatus(status){
  if(status==='completed') return STEPS.length-1;
  if(status==='discarded') return 0;
  const idx = STEPS.findIndex(s=>s.id===status);
  return idx>=0?idx:0;
}

// ════════════════════════════════════════════════════════
// PROCESS VIEW
// ════════════════════════════════════════════════════════
function renderProcessView(){
  renderProgress();
  renderStepHeader();
  renderStep();
  renderNav();
}

function renderProgress(){
  const track = document.getElementById('progress-track');
  const proc = getData();
  track.innerHTML = STEPS.map((s,i)=>{
    const stepIdx = STEPS.findIndex(x=>x.id===proc.status);
    const done = i < (stepIdx>=0?stepIdx:0);
    const active = i===currentStepIdx;
    const gate = s.gate?'gate':'';
    return `<div class="progress-node ${done?'done':''} ${active?'active':''} ${gate}" onclick="goToStep(${i})" title="${s.title}">
      <div class="pn-dot">${done?'✓':i+1}</div>
      <div class="pn-label">${s.label}</div>
    </div>`;
  }).join('');
}

function goToStep(i){
  // Only allow going back or to current step
  const proc = getData();
  const currentStatusIdx = STEPS.findIndex(s=>s.id===proc.status);
  if(i<=currentStatusIdx) { currentStepIdx=i; renderProcessView(); }
}

function renderStepHeader(){
  const s = STEPS[currentStepIdx];
  document.getElementById('step-header').innerHTML = `
    <div class="step-meta">Paso ${currentStepIdx+1} de ${STEPS.length}</div>
    <div class="step-title" style="color:${s.color}">${s.title}</div>
    <div class="step-subtitle">${s.subtitle}</div>`;
}

function renderNav(){
  const proc = getData();
  const isDiscarded = proc.status==='discarded';
  const isCompleted = proc.status==='completed';
  document.getElementById('btn-prev').style.display = currentStepIdx>0?'':'none';
  document.getElementById('btn-next').style.display = (isDiscarded||isCompleted)?'none':'';
  const s = STEPS[currentStepIdx];
  document.getElementById('nav-info').textContent = `Auto-guardado · ${proc.updatedAt?new Date(proc.updatedAt).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'sin cambios'}`;
}

// STEP RENDERER
// ════════════════════════════════════════════════════════
function renderStep(){
  const s = STEPS[currentStepIdx];
  const el = document.getElementById('step-content');
  if(s.id==='preA')      { el.innerHTML = renderPreA(); bindPreA(); }
  else if(s.id==='preB') { el.innerHTML = renderPreB(); bindPreB(); }
  else if(s.id==='killGate1') { el.innerHTML = renderGate('killGate1','¿Vale la pena relevar este proceso?',['El proceso tiene volumen suficiente para justificar el análisis','El Director facilitará acceso al equipo operativo','El proceso es relevante para el presupuesto 2027','No está siendo trabajado por otra iniciativa activa']); bindGate('killGate1'); }
  else if(s.id==='preC') { el.innerHTML = renderPreC(); bindPreC(); }
  else if(s.id==='realign') { el.innerHTML = renderRealign(); bindRealign(); }
  else if(s.id==='killGate2') { el.innerHTML = renderGate('killGate2','¿El proceso es automatizable?',['El proceso es repetitivo y estandarizable','Los datos necesarios están disponibles o pueden estarlo','El equipo mostró apertura al cambio','El impacto potencial justifica la inversión','La métrica de éxito está definida y tiene un responsable de medición']); bindGate('killGate2'); }
  else if(s.id==='paso1') { el.innerHTML = renderPaso1(); bindPaso1(); }
  else if(s.id==='paso2') { el.innerHTML = renderPaso2(); bindPaso2(); }
  else if(s.id==='killGate3') { el.innerHTML = renderGate('killGate3','¿IT puede ejecutarlo en 2027?',['IT confirmó factibilidad Alta o Media','Las condiciones técnicas son alcanzables en 2027','No depende de sistemas en proceso de reemplazo o migración']); bindGate('killGate3'); }
  else if(s.id==='paso3') { el.innerHTML = renderPaso3(); bindPaso3(); }
  else if(s.id==='paso4') { el.innerHTML = renderPaso4(); bindPaso4(); }
  else if(s.id==='signoff') { el.innerHTML = renderSignoff(); bindSignoff(); }
}

function renderGate(gateId, question, criteria){
  const d = getStepData(gateId);
  const checks = d.checks||criteria.map(()=>false);

  return `
  <div class="gate-card">
    <div class="gate-title">⛔ ${STEPS.find(s=>s.id===gateId).title}</div>
    <div class="gate-subtitle">${question} — Todos los criterios deben cumplirse para continuar.</div>
    <div class="gate-criteria">
      ${criteria.map((c,i)=>`
        <div class="gate-crit ${checks[i]?'checked':''}" id="gc-${i}" onclick="toggleGateCrit('${gateId}',${i})">
          <div class="crit-check">${checks[i]?'✓':''}</div>
          <div class="crit-text">${c}</div>
        </div>`).join('')}
    </div>
    <div class="gate-discard">
      <label>Si el proceso no pasa este gate, registrá la razón del descarte:</label>
      <textarea id="gate-discard-reason" placeholder="Razón del descarte (dejar vacío si pasa el gate)">${esc(d.discardReason)}</textarea>
    </div>
  </div>`;
}
function bindGate(gateId){
  autoById('gate-discard-reason', val=>setStepData(gateId,{discardReason:val}));
}
function toggleGateCrit(gateId, idx){
  const d = getStepData(gateId);
  const criteria = d.checks||(gateId==='killGate1'?[false,false,false,false]:gateId==='killGate2'?[false,false,false,false]:[false,false,false]);
  criteria[idx] = !criteria[idx];
  setStepData(gateId,{checks:criteria});
  const el = document.getElementById(`gc-${idx}`);
  el.classList.toggle('checked',criteria[idx]);
  el.querySelector('.crit-check').textContent = criteria[idx]?'✓':'';
}

// NAVIGATION
// ════════════════════════════════════════════════════════
function nextStep(){
  const proc = getData();
  const s = STEPS[currentStepIdx];

  // Validate kill gate
  if(s.gate||s.id.startsWith('killGate')){
    const d = getStepData(s.id);
    const allChecked = (d.checks||[]).every(Boolean);
    const discardReason = (d.discardReason||'').trim();
    if(!allChecked && !discardReason){
      alert('Marcá todos los criterios o registrá la razón del descarte antes de continuar.');
      return;
    }
    if(!allChecked && discardReason){
      if(!confirm('¿Confirmás que este proceso no pasa el Kill Gate y se descarta?')) return;
      db[currentId].status = 'discarded';
      db[currentId].discardedAt = new Date().toISOString();
      db[currentId].discardReason = discardReason;
      saveDB();
      renderSidebar();
      renderProcessView();
      return;
    }
  }

  // Advance
  if(currentStepIdx < STEPS.length - 1){
    currentStepIdx++;
    db[currentId].status = STEPS[currentStepIdx].id;
    saveDB();
    renderSidebar();
    renderProcessView();
    document.getElementById('main').scrollTop=0;
  } else {
    // Final step done
    db[currentId].status = 'completed';
    saveDB();
    renderSidebar();
    document.getElementById('btn-onepager').style.display='';
    alert('¡Análisis completo! El one-pager está habilitado.');
  }
}

function prevStep(){
  if(currentStepIdx > 0){
    currentStepIdx--;
    renderProcessView();
    document.getElementById('main').scrollTop=0;
  }
}

// HELPERS — UI COMPONENTS

function renderRadio(name, options, selected){
  return `<div class="radio-group">${options.map(o=>`
    <label class="radio-opt ${selected===o?'selected':''}" id="ro-${name}-${o.replace(/\s+/g,'_')}">
      <input type="radio" name="${name}" value="${o}" ${selected===o?'checked':''}>
      ${o}
    </label>`).join('')}</div>`;
}
function bindRadio(name, stepId, field, cb){
  document.querySelectorAll(`input[name="${name}"]`).forEach(el=>{
    el.addEventListener('change',e=>{
      const val=e.target.value;
      document.querySelectorAll(`label[id^="ro-${name}-"]`).forEach(l=>l.classList.remove('selected'));
      const labelId=`ro-${name}-${val.replace(/\s+/g,'_')}`;
      document.getElementById(labelId)?.classList.add('selected');
      setStepData(stepId,{[field]:val});
      if(cb) cb(val);
    });
  });
}

function renderMultiCheck(name, options, selected){
  return `<div class="check-group">${options.map(o=>`
    <label class="check-opt ${(selected||[]).includes(o)?'selected':''}" id="co-${name}-${o.replace(/\s+/g,'_')}" onclick="toggleCheck('${name}','${o}')">
      ${o}
    </label>`).join('')}</div>`;
}
function toggleCheck(name, option){
  const labelId=`co-${name}-${option.replace(/\s+/g,'_')}`;
  document.getElementById(labelId)?.classList.toggle('selected');
}
function bindMultiCheck(name, stepId, field){
  // already handled via onclick toggleCheck; read on save
  const getSelected=()=>Array.from(document.querySelectorAll(`label[id^="co-${name}-"].selected`)).map(l=>l.textContent.trim());
  document.querySelectorAll(`label[id^="co-${name}-"]`).forEach(el=>{
    el.addEventListener('click',()=>{ setTimeout(()=>setStepData(stepId,{[field]:getSelected()}),50); });
  });
}

function renderConfirm(id, text, checked){
  return `<div class="confirm-check ${checked?'checked':''}" id="${id}" onclick="toggleConfirm('${id}')">
    <div class="confirm-box">${checked?'✓':''}</div>
    <div class="confirm-text">${text}</div>
  </div>`;
}
function toggleConfirm(id){
  const el=document.getElementById(id);
  const now=!el.classList.contains('checked');
  el.classList.toggle('checked',now);
  el.querySelector('.confirm-box').textContent=now?'✓':'';
  return now;
}
function bindConfirm(id, stepId, field){
  document.getElementById(id)?.addEventListener('click',()=>{
    const val=document.getElementById(id)?.classList.contains('checked');
    setStepData(stepId,{[field]:val});
  });
}

function addRep(listId, itemClass, stepId, field){
  const list=document.getElementById(listId);
  const idx=list.querySelectorAll('.rep-row').length;
  const row=document.createElement('div');
  row.className='rep-row';
  row.innerHTML=`<input type="text" class="${itemClass}" placeholder=""><button class="rep-del" onclick="removeRep('${listId}',${idx})">×</button>`;
  list.appendChild(row);
  row.querySelector('input').addEventListener('input',()=>syncRep(listId,itemClass,stepId,field));
}
function removeRep(listId, idx){
  const list=document.getElementById(listId);
  const rows=list.querySelectorAll('.rep-row');
  if(rows[idx]) rows[idx].remove();
}
function syncRep(listId, itemClass, stepId, field){
  const vals=Array.from(document.querySelectorAll(`#${listId} .${itemClass}`)).map(i=>i.value);
  setStepData(stepId,{[field]:vals});
}
function bindRepList(listId, itemClass, stepId, field){
  document.querySelectorAll(`#${listId} .${itemClass}`).forEach(el=>{
    el.addEventListener('input',()=>syncRep(listId,itemClass,stepId,field));
  });
}
function addStep(){
  const list=document.getElementById('pasos-list');
  const idx=list.querySelectorAll('.step-row').length;
  const row=document.createElement('div');
  row.className='step-row';
  row.innerHTML=`<div class="step-num">${idx+1}</div><textarea class="paso-item" placeholder="Describí este paso..."></textarea><button class="rep-del" onclick="removeStep(${idx})">×</button>`;
  list.appendChild(row);
  row.querySelector('textarea').addEventListener('input',syncSteps);
  renumberSteps();
}
function removeStep(idx){
  const list=document.getElementById('pasos-list');
  const rows=list.querySelectorAll('.step-row');
  if(rows[idx]) rows[idx].remove();
  renumberSteps(); syncSteps();
}
function renumberSteps(){
  document.querySelectorAll('#pasos-list .step-num').forEach((el,i)=>el.textContent=i+1);
}
function syncSteps(){
  const vals=Array.from(document.querySelectorAll('#pasos-list .paso-item')).map(t=>t.value);
  setStepData('preC',{pasos:vals});
}
function bindStepsList(){
  document.querySelectorAll('#pasos-list .paso-item').forEach(el=>el.addEventListener('input',syncSteps));
}

// ════════════════════════════════════════════════════════
// HELPERS — GENERIC
// ════════════════════════════════════════════════════════
function auto(id, stepId, field, cb){
  const el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('input',e=>{ setStepData(stepId,{[field]:e.target.value}); if(cb) cb(e.target.value); });
}
function autoById(id, cb){
  const el=document.getElementById(id);
  if(el) el.addEventListener('input',e=>cb(e.target.value));
}
function v(id){ return document.getElementById(id)?.value||''; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function fmtARS(n){ return n>0?`ARS ${Number(n).toLocaleString('es-AR')}`:'—'; }

function calcCostoMensual(d){
  const h=+d.horas||0, p=+d.personas||0, c=+d.costoHora||0;
  if(h&&p&&c) return fmtARS(h*p*c);
  if(h&&p) return `${h*p} horas/mes totales`;
  return '—';
}

function calcScore(){
  const p1=getStepData('paso1'), p2=getStepData('paso2'), p3=getStepData('paso3');
  const benBase=+p1.impBase||0;
  const inv=(+p3.invTec||0)+(+p3.invImpl||0)+(+p3.cmCap||0)+(+p3.cmRoles||0)+(+p3.cmSoporte||0);
  const factMap={'Alta':20,'Media':10,'Baja':0};
  const confMap={'Medido formalmente':15,'Validado por el equipo':10,'Estimación':5};
  let s=0;
  // Impacto P&L (0-40)
  if(benBase>0&&inv>0){ const ratio=benBase/inv; s+=ratio>2?40:ratio>1?30:ratio>0.5?20:10; }
  // Payback (0-25)
  if(benBase>0&&inv>0){ const pb=inv/benBase*12; s+=pb<12?25:pb<24?18:pb<36?10:3; }
  // Factibilidad IT (0-20)
  s+=factMap[p2.itFactibilidad]||0;
  // Confianza dato (0-15)
  s+=confMap[p1.confianza]||0;
  return Math.min(s,100);
}

function openNewModal(){
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('new-proc-name').focus();
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}
function createProcess(){
  const name=document.getElementById('new-proc-name').value.trim();
  const area=document.getElementById('new-proc-area').value.trim();
  if(!name){ alert('Ingresá un nombre'); return; }
  const id='proc_'+Date.now();
  db[id]={ id, name, area, status:'preA', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  saveDB();
  closeModal();
  document.getElementById('new-proc-name').value='';
  document.getElementById('new-proc-area').value='';
  selectProcess(id);
  renderSidebar();
}

// ════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ════════════════════════════════════════════════════════
function exportJSON(){
  if(!currentId) return;
  const data=db[currentId];
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`proceso-${(data.name||'sin-nombre').toLowerCase().replace(/\s+/g,'-')}.json`;
  a.click();
}
function importJSON(){ document.getElementById('file-import').click(); }
function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if(!data.id) data.id='proc_'+Date.now();
      db[data.id]=data;
      saveDB(); renderSidebar();
      selectProcess(data.id);
      alert(`Proceso "${data.name||data.id}" importado correctamente.`);
    } catch{ alert('Error al leer el archivo JSON.'); }
  };
  reader.readAsText(file);
  e.target.value='';
}
